[project]
name = "plataforma-hidrica-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "geoalchemy2>=0.21.0",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "BLE"]
ignore = ["S101"]  # assert es válido en pruebas

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # contraseñas de prueba

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# Patrón estándar de FastAPI: Query/Depends/File/Form en los valores por defecto
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.File", "fastapi.Form"]
