[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hidrica-ml"
version = "0.1.0"
requires-python = ">=3.12"
description = "Modelos de predicción de disponibilidad hídrica (tesis URBE)"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "torch>=2.4",
    "xgboost>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# X / Y en mayúscula es la convención de ML (matriz de variables / objetivos)
ignore = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["hidrica_ml"]

[tool.hatch.build.targets.wheel]
packages = ["src/hidrica_ml"]
