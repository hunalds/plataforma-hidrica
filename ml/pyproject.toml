[project]
name = "plataforma-hidrica-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
