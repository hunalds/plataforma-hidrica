# Nginx del frontend: archivos estáticos con caché larga, SPA y proxy de la API.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Archivos con hash en el nombre: caché de un año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API del backend (mismo dominio)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # reportes y predicciones pesadas
        client_max_body_size 12m;  # importación de Excel/CSV (límite de la app: 10 MB)
    }

    # Rutas del frontend (React Router)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
